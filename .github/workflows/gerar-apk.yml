# Gera o APK automaticamente no GitHub a cada "push".
# Para baixar: aba "Actions" do repositório → clique na execução mais recente → "Artifacts".
name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes e gerar o APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AvaliadorCorridas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AvaliadorCorridas-apk
          path: AvaliadorCorridas.apk
